name: WinRT Builds 
on:
  push:
    branches:
      - rebase
  pull_request:
    branches:
      - rebase

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: ['Release']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up NuGet
      uses: NuGet/setup-nuget@v2.0.1

    - name: Extract version string from AppxManifest
      id: extract_version
      run: |
        $manifest = [xml](Get-Content Source\DolphinWinRT\Package.appxmanifest)
        $version = $manifest.Package.Identity.Version
        echo $version
        echo version=$version >> $env:GITHUB_OUTPUT
        
    - name: Echo the GitHub Env for File Names
      run: |
        echo "${{ steps.extract_version.outputs.version }}"

    - name: Restore NuGet packages
      run: nuget restore Source\dolphin-emu.sln

    - name: Build the project
      run: msbuild Source\dolphin-emu.sln /m /p:PlatformToolset=v143 /t:Restore,Rebuild /p:Configuration="${{ matrix.configuration }}" /p:Platform=x64 /t:restore,build /p:RestorePackagesConfig=true
  
    - name: Upload APPX file
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4.6.0
      with:
        name: appx-${{ matrix.configuration }}
        path: "Source\\AppPackages\\DolphinWinRT\\DolphinWinRT_${{ steps.extract_version.outputs.version }}_x64_Test\\DolphinWinRT_${{ steps.extract_version.outputs.version }}_x64.appxbundle"
